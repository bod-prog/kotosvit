<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"/>
<title>Котосвіт</title>
<style>
:root{--ink:#f4ead8;--mute:#cbbba0;--gold:#e8b86d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#07060c;color:var(--ink);font-family:Georgia,"Palatino Linotype",serif;overflow:hidden}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.sky{flex:1;position:relative;overflow:hidden;min-height:0}
canvas.world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.world.drag{cursor:grabbing}
.vignette{position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,6,12,.25),transparent 26%,transparent 62%,rgba(7,6,12,.85));pointer-events:none}
.float{position:absolute;left:14px;right:14px;top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px;z-index:3;align-items:center}
.chip{background:rgba(18,12,8,.58);backdrop-filter:blur(10px);border:1px solid rgba(232,184,109,.28);border-radius:999px;padding:7px 11px;font-size:13px;color:var(--ink);font-family:inherit;white-space:nowrap}
.chip.fish{color:#9fd3ff;border-color:rgba(120,190,255,.35)}
.chip.reset{margin-left:auto;cursor:pointer;padding:6px 10px}
.hidden{display:none!important}
.speech{position:absolute;left:16px;right:16px;bottom:14px;z-index:3;background:rgba(20,13,9,.74);border:1px solid rgba(232,184,109,.25);border-radius:20px 20px 20px 8px;padding:11px 14px;backdrop-filter:blur(12px);transition:opacity .3s}
.speech b{display:block;color:var(--gold);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.speech p{margin:3px 0 0;font-size:15px;line-height:1.35}
.toast{position:absolute;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translateX(-50%);z-index:4;background:rgba(232,184,109,.92);color:#2a190c;font-size:13px;padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .35s;pointer-events:none;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.panel{background:linear-gradient(180deg,#1c140e,#120d0a);padding:12px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(232,184,109,.2)}
.btn{width:100%;border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;background:linear-gradient(135deg,#e8b86d,#c4843a);color:#2a190c;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.98)}
.bar{height:8px;border-radius:99px;background:#2a2018;margin:4px 0 12px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8b86d,#fff1c8);transition:width .2s}
.tiny{color:var(--mute);font-size:12px;text-align:center;min-height:16px;margin-top:8px}
.rate{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--mute);margin-bottom:8px}
.rate b{color:#9fd3ff;font-size:14px}
.shop{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.shop::-webkit-scrollbar{display:none}
.card{flex:0 0 132px;background:rgba(232,184,109,.06);border:1px solid rgba(232,184,109,.22);border-radius:14px;padding:9px 10px;cursor:pointer;transition:border-color .15s,background .15s;font-family:inherit;color:var(--ink);text-align:left}
.card:disabled{opacity:.45;cursor:default}
.card.ok{border-color:#e8b86d;background:rgba(232,184,109,.14)}
.card.done{border-color:rgba(159,211,255,.4);opacity:.75;cursor:default}
.card .n{font-size:13px;font-weight:700;display:block}
.card .r{font-size:11px;color:var(--mute);display:block;margin-top:2px;min-height:14px}
.card .c{font-size:12px;color:#9fd3ff;display:block;margin-top:5px}
.cast{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.cast::-webkit-scrollbar{display:none}
.who{flex:0 0 64px;text-align:center;font-size:11px;color:var(--mute)}
.who canvas{width:64px;height:64px;border-radius:16px;border:1px solid rgba(232,184,109,.25);background:#1a120c;display:block;filter:grayscale(1) brightness(.45)}
.who.on canvas{filter:none;box-shadow:0 0 0 2px #e8b86d}
.who.on{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
  <div class="sky">
    <canvas class="world" id="cv" aria-label="Планета Котосвіт"></canvas>
    <div class="vignette"></div>
    <div class="float">
      <div class="chip" id="pop">коти 1</div>
      <div class="chip" id="bld">будівлі 0</div>
      <div class="chip fish hidden" id="fishc">🐟 0</div>
      <button class="chip reset" id="reset" title="Почати спочатку">⟲</button>
    </div>
    <div class="toast" id="toast"></div>
    <div class="speech"><b id="who">Мурко</b><p id="line">Тут тихо. Мені потрібен дім.</p></div>
  </div>
  <div class="panel">
    <div id="story">
      <div class="bar"><i id="p"></i></div>
      <button class="btn" id="act">Допомогти з хатою</button>
      <div class="tiny" id="hint">кожен тап — ще один брус</div>
    </div>
    <div id="build" class="hidden">
      <div class="rate"><span>коти ловлять <b id="rate">0</b> 🐟/с</span><span id="next"></span></div>
      <div class="shop" id="shop"></div>
      <button class="btn" id="fishbtn">Закинути вудку</button>
      <div class="tiny">торкнись кота — він замуркоче і поділиться рибкою</div>
    </div>
    <div class="cast" id="cast"></div>
  </div>
</div>
<script>
"use strict";
const TAU=Math.PI*2, D2R=Math.PI/180;
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const wrap=d=>((d+540)%360)-180;

/* ---------- мешканці ---------- */
const CATS={
  murko:{name:"Мурко",role:"будівничий",fur:"#d9924a",belly:"#f6e3c6",eye:"#7cc46a",home:0,
    lines:["Дах не тече. Я перевіряв двічі.","Колись тут був лише камінь і вітер.","Дім — це коли є кому відчинити."]},
  luna:{name:"Луна",role:"берегиня вогню",fur:"#8e8aa6",belly:"#e8e4f2",eye:"#f1c86a",home:14,
    lines:["Вогонь любить, коли з ним розмовляють.","Весна прийшла, бо ми чекали її разом.","Кошенята сплять. Нарешті."]},
  puh:{name:"Пух",role:"кошеня",fur:"#f0d9b5",belly:"#fff8ee",eye:"#6aa9e0",home:6,kitten:true,
    lines:["Коли виросту, я буду... ще не знаю ким!","Дивись, я зловив сонячний зайчик!"]},
  tin:{name:"Тінь",role:"кошеня",fur:"#3b3744",belly:"#7d7890",eye:"#f1c86a",home:-8,kitten:true,
    lines:["Тсс. Я вистежую тінь.","Уночі зірки ближче. Я перевіряла."]},
  sem:{name:"Сем",role:"бариста",fur:"#5b4636",belly:"#c9a27a",eye:"#a8d86a",home:-30,
    lines:["Перша чашка — завжди для гостя.","Кава смачніша, коли дощ стукає по навісу.","Віктор винен мені три еспресо."]},
  viktor:{name:"Віктор",role:"кіномеханік",fur:"#2b2b33",belly:"#f4f4f4",eye:"#e0b05a",home:30,
    lines:["Сьогодні на екрані — захід сонця. Безкоштовно.","Світло в залі гасне, і світ стає ширшим.","Кіно — це коли всі мовчать разом."]},
  taras:{name:"Тарас",role:"рибалка",fur:"#c7c2b8",belly:"#f3efe8",eye:"#5f9fd6",home:-62,
    lines:["Риба йде на тишу, а не на наживку.","Хвилі тут маленькі, але справжні.","Пірс скрипить — значить живий."]},
  zorya:{name:"Зоря",role:"садівниця",fur:"#e2a24a",belly:"#fff0d0",eye:"#5fb36a",home:62,
    hello:"Я Зоря. Тут земля тепла — буде город.",
    lines:["М'ята пішла. Валер'яна — поки секрет.","Город слухає, якщо говорити пошепки."]},
  oskar:{name:"Оскар",role:"книжник",fur:"#7a5c48",belly:"#d8c2a8",eye:"#7cc46a",home:-96,
    hello:"Я Оскар. Місту потрібні історії, що не зникають.",
    lines:["Книжка про далекі планети. Виявилось — про нас.","Тиша в бібліотеці — найголосніша."]},
  marta:{name:"Марта",role:"доглядачка маяка",fur:"#b35c3d",belly:"#f6dcc8",eye:"#f1c86a",home:100,
    hello:"Я Марта. Хтось має світити тим, хто повертається.",
    lines:["Маяк світить не кораблям. Він світить тим, хто вертається.","Уночі я рахую хвилі замість овець."]},
  mila:{name:"Міла",role:"астрономка",fur:"#f2f2f2",belly:"#ffffff",eye:"#6aa9e0",home:140,
    hello:"Я Міла. Хочу знати, що там, за небом.",
    lines:["Я бачила планету, де коти ще не мріють.","Зірки не падають. Вони просто спускаються подивитись."]},
  barsyk:{name:"Барсик",role:"мер",fur:"#6e6e74",belly:"#d8d8dc",eye:"#e0b05a",home:-150,
    hello:"Я Барсик. Коли котів багато — потрібне місце, де всі вирішують разом.",
    lines:["Перший указ: пообідня дрімота обов'язкова.","Ратуша — це просто велика хата для всіх."]}
};
const ORDER=Object.keys(CATS);

/* ---------- будівлі ---------- */
const BUILD={
  house:{name:"Хата Мурка",ang:0,h:76},
  fire:{name:"Вогнище",ang:14,h:22},
  cafe:{name:"Кав'ярня Сема",ang:-30,h:70},
  cinema:{name:"Кіно Віктора",ang:30,h:84},
  pier:{name:"Пірс Тараса",ang:-62,h:26,custom:true},
  garden:{name:"Город",ang:62,h:34,cost:25,rate:1,cat:"zorya",custom:true},
  library:{name:"Бібліотека",ang:-96,h:76,cost:80,rate:2,cat:"oskar"},
  lighthouse:{name:"Маяк",ang:100,h:118,cost:220,rate:4,cat:"marta"},
  observatory:{name:"Обсерваторія",ang:140,h:86,cost:600,rate:8,cat:"mila"},
  hall:{name:"Ратуша",ang:-150,h:96,cost:1500,rate:15,cat:"barsyk"}
};
const SHOP=["garden","library","lighthouse","observatory","hall"];
const TREES=[[-16,1,.9],[44,0,1],[-46,0,.8],[78,1,1.1],[-78,0,.9],[118,0,.8],[-116,1,1],[160,1,.9],[-170,0,1],[185,1,.8],[-135,1,.7],[22,0,.6]];
const FLOWERS=[-22,8,38,-38,52,-52,70,-84,90,-110];
const FINALE="Хати, кав'ярня, кіно, пірс, город, бібліотека, маяк, обсерваторія, ратуша. Котосвіт живе своїм життям — і радий, що ти поруч.";

/* ---------- сюжет ---------- */
const STAGES=[
  {who:"murko",line:"Тут тихо. Мені потрібен дім.",btn:"Допомогти з хатою",need:8,hint:"кожен тап — ще один брус",build:"house",to:.55},
  {who:"murko",line:"Дах тримається. Вже пахне деревом.",btn:"Добити хату",need:6,hint:"ще трохи",build:"house",from:.55,to:1},
  {who:"murko",line:"Дім стоїть. Але одному тут порожньо.",btn:"Покликати когось",need:1,hint:"хтось уже йде стежкою"},
  {who:"luna",line:"Я Луна. Можна лишитись біля вогню?",btn:"Прийняти Луну",need:1,hint:""},
  {who:"luna",line:"Якщо буде сім'я — з'являться і вулиці.",btn:"Почекати весну",need:5,hint:"ніч коротшає з кожним тапом"},
  {who:"kits",line:"Двоє. Вони ще не знають, ким стануть.",btn:"Дати імена",need:1,hint:""},
  {who:"sem",line:"Я Сем. Мені сниться кава і розмови.",btn:"Відвести місце під кав'ярню",need:7,hint:"камінь, навіс, перша чашка",build:"cafe",to:1},
  {who:"viktor",line:"Я Віктор. Планеті потрібне кіно.",btn:"Засвітити вивіску",need:7,hint:"теплий екран у темряві",build:"cinema",to:1},
  {who:"world",line:"Хати, кав'ярня, кіно. Цивілізація почалась.",btn:"Це лише перший шар",need:1,hint:"планету можна крутити пальцем"},
  {who:"taras",line:"Я Тарас. Чую — під берегом плескає риба.",btn:"Збити пірс",need:6,hint:"дошка за дошкою над водою",build:"pier",to:1},
  {who:"taras",line:"Рибки — наша валюта. Коти ловлять самі, а ти вирішуєш, що будувати.",btn:"Домовились",need:1,hint:""}
];
const BUILD_MODE=STAGES.length;

/* ---------- стан ---------- */
const KEY="kotosvit";
let S=load();
function fresh(){return {step:0,t:0,fish:0,owned:[],clock:.32,seen:Date.now(),petted:0}}
function load(){
  try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&typeof j.step==="number")return Object.assign(fresh(),j);}catch(e){}
  const old=+localStorage.kotoStep; // сумісність з першою версією
  const s=fresh(); if(old>0)s.step=Math.min(old,8); return s;
}
let saveAt=0, allowSave=true;
function save(now){if(!allowSave)return;S.seen=Date.now();localStorage.setItem(KEY,JSON.stringify(S));saveAt=now||0;}

const prog={};          // прогрес кожної будівлі 0..1
const constructing={};  // будівлі, що зводяться в режимі міста
const cats={};          // живі коти на планеті
let spring=0, cam=0, camTgt=0, follow=true, night=0, T=0;
const parts=[];

function stage(){return STAGES[Math.min(S.step,BUILD_MODE-1)]}
function inBuild(){return S.step>=BUILD_MODE}
function rate(){return inBuild()?0.5+S.owned.reduce((a,k)=>a+BUILD[k].rate,0):0}
function hush(){chatterAt=Math.max(chatterAt,14)}

/* стан світу виводиться зі сторінки сюжету — так збереження завжди узгоджене */
function syncWorld(live){
  const st=S.step,t=S.t;
  prog.house=st===0?t/8*0.55:st===1?0.55+t/6*0.45:st>=2?1:0;
  prog.fire=st>=3?1:0;
  spring=st===4?t/5:st>=5?1:0;
  prog.cafe=st===6?t/7:st>=7?1:0;
  prog.cinema=st===7?t/7:st>=8?1:0;
  prog.pier=st===9?t/6:st>=10?1:0;
  for(const k of SHOP) if(!(k in constructing)) prog[k]=S.owned.includes(k)?1:0;
  const present={murko:true,luna:st>=3,puh:st>=5,tin:st>=5,sem:st>=6,viktor:st>=7,taras:st>=9};
  for(const k of SHOP) if(S.owned.includes(k)&&!(k in constructing)) present[BUILD[k].cat]=true;
  for(const k in present) if(present[k]&&!cats[k]) spawn(k,live);
}
function spawn(k,walkIn){
  const c=Object.assign({key:k,a:CATS[k].home,tgt:CATS[k].home,dir:1,speed:CATS[k].kitten?9:6.5,wait:0,walking:false,pet:0},CATS[k]);
  if(walkIn){c.a=c.home+(Math.random()<.5?-1:1)*34;c.tgt=c.home;c.dir=c.tgt>c.a?1:-1;c.walking=true;}
  else c.wait=rnd(1,4);
  cats[k]=c;
}
function settled(){
  let lo=-20,hi=20;
  for(const k in BUILD) if(prog[k]>0){lo=Math.min(lo,BUILD[k].ang-14);hi=Math.max(hi,BUILD[k].ang+14);}
  return [lo,hi];
}

/* ---------- інтерфейс ---------- */
function say(who,text){
  $("#who").textContent=who==="world"?"Котосвіт":who==="kits"?"Кошенята":CATS[who].name;
  $("#line").textContent=text;
}
let toastT;
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2600);}
function focus(ang){camTgt=ang;follow=true;}
function fmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"к":Math.floor(n)+""}

function paint(){
  const built=Object.keys(BUILD).filter(k=>prog[k]>=1&&k!=="fire").length;
  $("#pop").textContent="коти "+Object.keys(cats).length;
  $("#bld").textContent="будівлі "+built;
  $("#fishc").classList.toggle("hidden",S.step<9);
  $("#fishc").textContent="🐟 "+fmt(S.fish);
  if(inBuild()){
    $("#story").classList.add("hidden");$("#build").classList.remove("hidden");
    $("#rate").textContent=rate().toFixed(1);
    const nxt=SHOP.find(k=>!S.owned.includes(k));
    $("#next").textContent=nxt&&S.fish<BUILD[nxt].cost?`до «${BUILD[nxt].name}» ще ${Math.ceil(BUILD[nxt].cost-S.fish)}`:"";
    for(const k of SHOP){
      const el=document.getElementById("card-"+k),b=BUILD[k],own=S.owned.includes(k);
      el.classList.toggle("done",own);el.classList.toggle("ok",!own&&S.fish>=b.cost);
      el.disabled=own||S.fish<b.cost;
      el.querySelector(".c").textContent=own?(k in constructing?"будується…":"✓ збудовано"):"🐟 "+b.cost+" · +"+b.rate+"/с";
    }
  }else{
    $("#story").classList.remove("hidden");$("#build").classList.add("hidden");
    const s=stage();
    $("#act").textContent=s.btn;$("#hint").textContent=s.hint;
    $("#p").style.width=(S.t/s.need*100)+"%";
  }
  for(const k of ORDER){const e=document.getElementById("cast-"+k);e.classList.toggle("on",!!cats[k]);e.lastChild.textContent=cats[k]?CATS[k].name:"…";}
}
function buildShop(){
  $("#shop").innerHTML=SHOP.map(k=>`<button class="card" id="card-${k}"><span class="n">${BUILD[k].name}</span><span class="r">прийде ${CATS[BUILD[k].cat].name}, ${CATS[BUILD[k].cat].role}</span><span class="c"></span></button>`).join("");
  for(const k of SHOP) document.getElementById("card-"+k).onclick=()=>buy(k);
  $("#cast").innerHTML=ORDER.map(k=>`<div class="who" id="cast-${k}"><canvas width="128" height="128"></canvas><div>…</div></div>`).join("");
  for(const k of ORDER){
    const el=document.getElementById("cast-"+k);
    portrait(el.firstChild,CATS[k]);
    el.onclick=()=>{
      const c=cats[k];
      if(!c){toast("Ще не в Котосвіті");return;}
      focus(c.a);hush();say(k,c.lines[Math.floor(Math.random()*c.lines.length)]);
    };
  }
}

/* ---------- дії ---------- */
function stageEnter(){
  const s=stage();
  say(s.who,s.line);
  if(s.build) focus(BUILD[s.build].ang);
  else if(s.who in CATS) focus(CATS[s.who].home);
  else if(s.who==="kits") focus(0);
}
function tapStory(){
  const s=stage();
  hush();
  S.t++;
  if(S.step===4){S.clock+=.2;spring=S.t/5;}
  if(s.build){const from=s.from||0;prog[s.build]=from+(s.to-from)*Math.min(1,S.t/s.need);spark(BUILD[s.build].ang,BUILD[s.build].h*prog[s.build]*.5,"#f0cf8a",4);}
  if(S.t>=s.need){
    S.t=0;S.step++;
    if(S.step===3)toast("Луна йде стежкою");
    if(S.step===6)toast("Кошенят назвали Пух і Тінь");
    if(S.step===10)toast("Рибки тепер рахуються");
    if(S.step===BUILD_MODE)toast("Місто у твоїх лапах");
    syncWorld(true);
    if(S.step<BUILD_MODE)stageEnter();else say("taras","Пірс готовий. Тапай «Закинути вудку» або гладь котів — і вирішуй, що будувати далі.");
  }
  paint();save(T);
}
function fishTap(fromAngle){
  S.fish+=1;
  spark(fromAngle==null?BUILD.pier.ang:fromAngle,6,"#9fd3ff",3);
  paint();
}
function buy(k){
  const b=BUILD[k];
  if(S.owned.includes(k)||S.fish<b.cost)return;
  S.fish-=b.cost;S.owned.push(k);constructing[k]=0;prog[k]=0;
  focus(b.ang);hush();say("world",`Коти збирають дошки для «${b.name}»…`);
  paint();save(T);
}
function finishBuild(k){
  delete constructing[k];prog[k]=1;
  const cat=BUILD[k].cat;spawn(cat,true);focus(CATS[cat].home);
  hush();say(cat,CATS[cat].hello);toast(`${CATS[cat].name} тепер у Котосвіті`);

/* ---------- кадр ---------- */
let last=performance.now(),chatterAt=8,saveTimer=0;
function frame(now){
  if(paused){last=now;requestAnimationFrame(frame);return;}
  const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;
  S.clock=(S.clock+dt/150)%1;
  const sunEl=-Math.cos(TAU*S.clock);night=clamp(.5-sunEl*1.1,0,1);
  if(inBuild()){S.fish+=rate()*dt;}
  for(const k in constructing){constructing[k]+=dt/5;prog[k]=Math.min(1,constructing[k]);if(constructing[k]>=1)finishBuild(k);}
  for(const k in cats){const c=cats[k];c.pet=Math.max(0,c.pet-dt);
    if(c.wait>0){c.wait-=dt;if(c.wait<=0){const[lo,hi]=settled();c.tgt=Math.random()<.45?c.home+rnd(-10,10):rnd(lo,hi);}continue;}
    const d=c.tgt-c.a;if(Math.abs(d)<.3){c.a=c.tgt;c.wait=rnd(2,6);c.walking=false;continue;}
    c.dir=d>0?1:-1;c.a+=c.dir*c.speed*dt;c.walking=true;}
  if(follow){const d=wrap(camTgt-cam);cam+=d*Math.min(1,dt*3.5);}
  if(inBuild()){chatterAt-=dt;if(chatterAt<=0){chatterAt=rnd(10,18);const ks=Object.keys(cats),c=cats[ks[Math.floor(Math.random()*ks.length)]];say(c.key,c.lines[Math.floor(Math.random()*c.lines.length)]);}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.h+=p.vy*dt;p.ang+=p.vx*dt/(R*D2R);if(p.life<=0)parts.splice(i,1);}
  saveTimer+=dt;if(saveTimer>3){saveTimer=0;save(T);}
  if(inBuild()&&Math.floor(T*4)!==Math.floor((T-dt)*4))paint();
  render();
  requestAnimationFrame(frame);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,lerpC(DAY_T,NIGHT_T,night));sky.addColorStop(1,lerpC(DAY_B,NIGHT_B,night));
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
  const th=TAU*S.clock-Math.PI,ORB=Math.min(W,H)*.78;
  const sx=CX+ORB*Math.sin(th),sy=CY-R*.3-ORB*Math.cos(th);
  if(sunEl()>-.2){glowCircle(sx,sy,120,"rgba(255,200,120,A)",.45*(1-night));circ(sx,sy,22,"#ffe6b0");}
  // планета
  const pg=ctx.createRadialGradient(CX,CY-R*.55,R*.1,CX,CY,R);pg.addColorStop(0,"#6f8f55");pg.addColorStop(.7,"#3e5e3a");pg.addColorStop(1,"#263d2b");
  ctx.fillStyle=pg;ctx.beginPath();ctx.arc(CX,CY,R,0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,R-1,0,TAU);ctx.clip();
  for(const[a,d,s]of BLOBS){const[x,y]=onSurface(a);ell(CX+(x-CX)*d,CY+(y-CY)*d,R*s,R*s*.6,"rgba(40,70,45,.45)");}
  ctx.restore();
  ctx.strokeStyle="#7aa660";ctx.lineWidth=7;ctx.beginPath();ctx.arc(CX,CY,R-3,0,TAU);ctx.stroke();
  // стежка між будівлями

    ctx.strokeStyle="rgba(201,162,122,.55)";ctx.lineWidth=2.5;ctx.setLineDash([5,7]);ctx.beginPath();

    ctx.stroke();ctx.setLineDash([]);

  for(const a of FLOWERS)if(spring>0&&visible(a))at(a,()=>{circ(0,-3*spring,1.6*spring,a%3?"#f1c86a":"#e8738a");});
  for(const[a,k,s]of TREES)if(visible(a))drawTree(a,k,s,false);
  for(const k in BUILD)if(visible(BUILD[k].ang))drawBuilding(k,false,T);
  const list=Object.values(cats).filter(c=>visible(c.a)).sort((a,b)=>(a.kitten?1:0)-(b.kitten?1:0));
  for(const c of list)drawCat(c,T,false);
  // ніч
  ctx.fillStyle=`rgba(6,5,14,${night*.5})`;ctx.fillRect(0,0,W,H);
  if(night>0){for(const[fx,fy,r,ph]of STARS){const tw=.55+.45*Math.sin(T*1.5+ph);ctx.fillStyle=`rgba(255,245,225,${night*tw})`;ctx.beginPath();ctx.arc(fx*W,fy*H,r,0,TAU);ctx.fill();}}
  const mx=CX-ORB*Math.sin(th),my=CY-R*.3+ORB*Math.cos(th);
  if(sunEl()<.2){ctx.globalAlpha=clamp((.2-sunEl())*2,0,1);glowCircle(mx,my,70,"rgba(220,230,255,A)",.3);circ(mx,my,15,"#e9ecf5");circ(mx-5,my-3,4,"#cfd4e2");circ(mx+6,my+5,2.5,"#cfd4e2");ctx.globalAlpha=1;}
  for(const k in BUILD)if(visible(BUILD[k].ang))drawBuilding(k,true,T);
  for(const c of list)drawCat(c,T,true);
  for(const p of parts){at(p.ang,()=>{ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;
    if(p.heart){ctx.beginPath();ctx.moveTo(0,-p.h+3);ctx.bezierCurveTo(-5,-p.h-2,-2,-p.h-6,0,-p.h-3);ctx.bezierCurveTo(2,-p.h-6,5,-p.h-2,0,-p.h+3);ctx.fill();}
    else{ctx.beginPath();ctx.arc(0,-p.h,p.r,0,TAU);ctx.fill();}ctx.globalAlpha=1;});}
}
function sunEl(){return -Math.cos(TAU*S.clock)}

/* ---------- введення ---------- */
let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,cam,moved:false};cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>4||Math.abs(e.clientY-drag.y)>4){drag.moved=true;cv.classList.add("drag");follow=false;}
  if(drag.moved)cam=drag.cam-dx/(R*D2R);});
cv.addEventListener("pointerup",e=>{if(!drag)return;cv.classList.remove("drag");
  if(!drag.moved){const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;let best=null,bd=34;
    for(const k in cats){const c=cats[k];if(!visible(c.a))continue;const[x,y]=onSurface(c.a);const d=Math.hypot(px-x,py-(y-16*(c.kitten?0.62:1)));if(d<bd){bd=d;best=c;}}
    if(best)pet(best);else if(inBuild()){const dx=px-CX,dy=py-CY;if(Math.hypot(dx,dy)<R+90){const ang=cam+Math.atan2(dx,-dy)/D2R;fishTap(ang);}}}
  drag=null;});
cv.addEventListener("pointercancel",()=>{drag=null;cv.classList.remove("drag");});
$("#act").onclick=tapStory;
$("#fishbtn").onclick=()=>{fishTap();focus(BUILD.pier.ang);};
$("#reset").onclick=reset;
let paused=false;
addEventListener("visibilitychange",()=>{
  if(document.hidden){paused=true;save(T);return;}
  const away=Math.min(6*3600,(Date.now()-S.seen)/1000);
  if(inBuild()&&away>1){const got=away*rate();S.fish+=got;if(got>=5)toast(`Поки тебе не було, коти наловили ${fmt(got)} 🐟`);}
  S.seen=Date.now();last=performance.now();paused=false;paint();
});
addEventListener("pagehide",()=>save(T));

/* ---------- старт ---------- */
resize();buildShop();syncWorld(false);
if(inBuild()){
  const away=Math.min(6*3600,(Date.now()-S.seen)/1000),got=away*rate();
  if(got>=5){S.fish+=got;setTimeout(()=>toast(`Поки тебе не було, коти наловили ${fmt(got)} 🐟`),600);}
  const nxt=SHOP.find(k=>!S.owned.includes(k));
  if(!nxt)say("world",FINALE);else say("taras","З поверненням. Коти ловлять рибу, а місто чекає на твої рішення.");
  cam=camTgt=0;
}else{stageEnter();cam=camTgt;}
paint();
requestAnimationFrame(frame);
</script>
